[package]
name = "pane-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pane"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"
# Compiles ui/ into the release exe (build.rs).
zgx-script = { workspace = true, default-features = false }

[dependencies]
pane-fs.workspace = true
pane-shell.workspace = true
pane-scan.workspace = true
zgx.workspace = true
# mimalloc as the allocator: about 10% less CPU listing 100k files, for
# 25-45 MB more private memory (measured 2026-11-27, see ROADMAP.md).
zgx-desktop = { workspace = true, features = ["mimalloc"] }
zgx-script.workspace = true
futures-channel.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
sha2.workspace = true
